  # ══════════════════════════════════════════════════════════════════════════════
  # T5: Tests — Commit lifecycle (R2, 3 scenarios)
  # ══════════════════════════════════════════════════════════════════════════════
  - id: T5
    title: "Tests — Commit Lifecycle (R2, spec #3-#5)"
    file: tests/ingestion/infrastructure/test_unit_of_work.py
    depends_on: [T1, T2, T3]
    description: >
      Tests para R2: verificar que commit() llama session.commit() exactamente
      1 vez, que recolecta eventos, y que falla con PersistenceError.

    details:
      imports_adicionales:
        - "from unittest.mock import MagicMock, PropertyMock"
        - "from sqlalchemy.exc import IntegrityError"
        - "from ingestion.infrastructure.persistence.exceptions import PersistenceError"
        - "from foundation.base.aggregate_root import AggregateRoot"
        - "from foundation.events.domain_event import DomainEvent"

      test_R2_commit_called_once:
        scenario: "#3 — Happy path: commit() calls session.commit() exactly 1×"
        code: |
          def test_commit_calls_session_commit_once(uow):
              """commit() MUST call session.commit() exactly once."""
              with uow:
                  uow._session.commit = MagicMock()  # type: ignore[method-assign]
                  uow.commit()
                  uow._session.commit.assert_called_once()

      test_R2_commit_collects_events:
        scenario: "#4 — Post-commit collects domain events"
        code: |
          def test_commit_collects_events(uow):
              """commit() MUST collect events from registered roots after session.commit()."""
              event = MagicMock(spec=DomainEvent)
              root = MagicMock(spec=AggregateRoot)
              root.pull_events.return_value = [event]

              with uow:
                  uow.register_modified(root)
                  uow._session.commit = MagicMock()  # type: ignore[method-assign]
                  uow.commit()

              assert len(uow._collected_events) == 1
              assert uow._collected_events[0] is event

      test_R2_commit_failure_raises_persistence_error:
        scenario: "#5 — Commit failure raises PersistenceError"
        code: |
          def test_commit_failure_raises_persistence_error(uow):
              """When session.commit() fails, commit() MUST raise PersistenceError."""
              with uow:
                  uow._session.commit = MagicMock(  # type: ignore[method-assign]
                      side_effect=IntegrityError("stmt", "params", "orig"),
                  )
                  with pytest.raises(PersistenceError, match="Commit failed"):
                      uow.commit()

    verify:
      - "pytest tests/ingestion/infrastructure/test_unit_of_work.py -k 'test_commit' — 3 PASS"

  # ══════════════════════════════════════════════════════════════════════════════
  # T6: Tests — Rollback lifecycle (R3, 2 scenarios)
  # ══════════════════════════════════════════════════════════════════════════════
  - id: T6
    title: "Tests — Rollback Lifecycle (R3, spec #6-#7)"
    file: tests/ingestion/infrastructure/test_unit_of_work.py
    depends_on: [T1, T2, T3]
    description: >
      Tests para R3: rollback explícito y auto-rollback en __exit__ con
      excepción.

    details:
      imports_adicionales:
        - "from unittest.mock import MagicMock"

      test_R3_explicit_rollback:
        scenario: "#6 — Explicit rollback calls session.rollback()"
        code: |
          def test_explicit_rollback(uow):
              """rollback() MUST call session.rollback()."""
              with uow:
                  uow._session.rollback = MagicMock()  # type: ignore[method-assign]
                  uow.rollback()
                  uow._session.rollback.assert_called_once()

      test_R3_auto_rollback_on_exception:
        scenario: "#7 — __exit__ auto-rollbacks on exception"
        code: |
          def test_auto_rollback_on_exception(uow):
              """__exit__ MUST call rollback() when an exception occurs."""
              rollback_spy = None
              try:
                  with uow:
                      uow._session.rollback = MagicMock()  # type: ignore[method-assign]
                      rollback_spy = uow._session.rollback
                      raise ValueError("boom")
              except ValueError:
                  pass

              # __exit__ sets _session = None, so we must use saved reference
              assert rollback_spy is not None
              rollback_spy.assert_called_once()

    verify:
      - "pytest tests/ingestion/infrastructure/test_unit_of_work.py -k 'test_explicit_rollback or test_auto_rollback' — 2 PASS"

