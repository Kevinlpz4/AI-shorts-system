  # T7: Tests — Close lifecycle (R4, 3 scenarios)
  # ══════════════════════════════════════════════════════════════════════════════
  - id: T7
    title: "Tests — Close Lifecycle (R4, spec #8-#10)"
    file: tests/ingestion/infrastructure/test_unit_of_work.py
    depends_on: [T1, T2, T3]
    description: >
      Tests para R4: close en salida normal, close después de error, y
      close idempotente.

    details:
      imports_adicionales:
        - "from unittest.mock import MagicMock"

      test_R4_close_on_normal_exit:
        scenario: "#8 — Normal __exit__ calls session.close()"
        code: |
          def test_close_called_on_normal_exit(uow):
              """__exit__ MUST call session.close() when no exception."""
              with uow:
                  uow._session.close = MagicMock()  # type: ignore[method-assign]

              uow._session.close.assert_called_once()

      test_R4_close_on_error_exit:
        scenario: "#9 — __exit__ with exception calls session.close() after rollback"
        code: |
          def test_close_called_on_error_exit(uow):
              """__exit__ MUST call session.close() even when an exception occurs."""
              try:
                  with uow:
                      uow._session.close = MagicMock()  # type: ignore[method-assign]
                      raise ValueError("boom")
              except ValueError:
                  pass

              uow._session.close.assert_called_once()

      test_R4_close_idempotent:
        scenario: "#10 — close() is idempotent"
        code: |
          def test_close_idempotent(uow):
              """Calling close() twice MUST NOT raise an error."""
              with uow:
                  pass  # __exit__ calls close() once
              # uow._session is now None — calling close() again should be safe
              uow.close()  # second call — must not raise

    verify:
      - "pytest tests/ingestion/infrastructure/test_unit_of_work.py -k 'test_close' — 3 PASS"

  # ══════════════════════════════════════════════════════════════════════════════
  # T8: Tests — Context Manager (R5, 2 scenarios)
  # ══════════════════════════════════════════════════════════════════════════════
  - id: T8
    title: "Tests — Context Manager (R5, spec #11-#12)"
    file: tests/ingestion/infrastructure/test_unit_of_work.py
    depends_on: [T1, T2, T3]
    description: >
      Tests para R5: with statement básico y UoWs anidados con Sessions
      independientes.

    details:
      test_R5_basic_with:
        scenario: "#11 — Basic with statement"
        code: |
          def test_basic_with_statement(uow):
              """UoW MUST work as a context manager with accessible repos."""
              with uow:
                  # Session is alive, repos are accessible
                  assert uow._session is not None
                  assert uow.news_sources is not None
                  # Session is active
                  from sqlalchemy import text
                  result = uow._session.execute(text("SELECT 1"))
                  assert result.scalar() == 1

              # After exit, session is closed
              assert uow._session is None

      test_R5_nested_uow:
        scenario: "#12 — Two UoW instances have independent Sessions"
        code: |
          def test_nested_uows_have_independent_sessions(uow_factory):
              """Each UoW instance MUST manage its own Session independently.

              Uses uow_factory fixture (defined below) to create independent UoWs.
              """
              uow1 = uow_factory()
              uow2 = uow_factory()

              with uow1:
                  with uow2:
                      # Different Session objects
                      assert uow1._session is not uow2._session
                      # Both alive
                      assert uow1._session is not None
                      assert uow2._session is not None

                  # uow2 exited — its session is closed
                  assert uow2._session is None
                  # uow1 still alive
                  assert uow1._session is not None

              # uow1 exited — its session is closed
              assert uow1._session is None

        nota: >
          Para este test se necesita una fixture `uow_factory` adicional que
          cree SQLAlchemyUnitOfWork(sqlite_session_factory) pero SIN tables
          (o con tables compartido). Agregarla en T3 o directamente en el
          test file.

          Alternativa más simple: crear dos instancias de SQLAlchemyUnitOfWork
          con el mismo session_factory dentro del test:

          def test_nested_uows_have_independent_sessions(sqlite_session_factory, tables):
              ...

    verify:
      - "pytest tests/ingestion/infrastructure/test_unit_of_work.py -k 'test_basic_with or test_nested_uow' — 2 PASS"

  # ══════════════════════════════════════════════════════════════════════════════
  # T9: Tests — Cross-Repo Session (R6, 2 scenarios)
  # ══════════════════════════════════════════════════════════════════════════════
  - id: T9
    title: "Tests — Cross-Repo Session Consistency (R6, spec #13-#14)"
    file: tests/ingestion/infrastructure/test_unit_of_work.py
    depends_on: [T1, T2, T3]
    description: >
      Tests para R6: verificar que todos los repos comparten la misma Session
      identity y que un flush en un repo es visible desde otro.

    details:
      imports_adicionales:
        - "from unittest.mock import MagicMock"

      test_R6_same_session_identity:
        scenario: "#13 — All repos share the exact same Session"
        code: |
          def test_all_repos_share_same_session(uow):
              """All 5 repos MUST share the exact same Session identity."""
              with uow:
                  assert uow.news_sources._session is uow.feeds._session
                  assert uow.news_sources._session is uow.raw_articles._session
                  assert uow.news_sources._session is uow.categories._session
                  assert uow.news_sources._session is uow.topics._session

      test_R9_session_identity_chain:
        scenario: "#14 — Session identity chain across ALL 5 repos (R9)"
        code: |
          def test_session_identity_chain(uow):
              """ALL 5 repos MUST share the exact same Session object.
              
              This is the FUNDAMENTAL purpose of the Unit of Work —
              a single transaction identity across all repositories.
              """
              with uow:
                  s = uow.news_sources._session
                  assert s is uow.feeds._session
                  assert s is uow.raw_articles._session
                  assert s is uow.categories._session
                  assert s is uow.topics._session

      test_R6_flush_visibility:
        scenario: "#14 — Uncommitted changes visible across repos via flush"
        code: |
          def test_flush_visibility_across_repos(uow):
              """Repo.save MUST be visible from another repo without explicit commit.
              
              Uses a NewsSource: save via news_sources, find via feeds (or just
              verify flush makes the data queryable).
              """
              from ingestion.domain.entities.ids import SourceId
              from ingestion.domain.entities.news_source import NewsSource
              from ingestion.domain.value_objects.source_type import SourceType
              from ingestion.domain.value_objects.source_url import SourceUrl

              source_id = SourceId()
              source = NewsSource(
                  id=source_id,
                  name="Flush-Visibility Test Source",
                  source_type=SourceType.RSS,
                  source_url=SourceUrl("https://example.com/flush-test"),
                  is_active=True,
              )

              with uow:
                  # Save source which does session.flush() internally
                  uow.news_sources.save(source)

                  # Without commit(), should be findable from another perspective
                  # via the same Session (flush already happened in repo.save())
                  found = uow.news_sources.find_by_id(source_id)
                  assert found.is_success()
                  assert found.unwrap().name == "Flush-Visibility Test Source"

    verify:
      - "pytest tests/ingestion/infrastructure/test_unit_of_work.py -k 'test_all_repos_share or test_flush_visibility' — 2 PASS"

  # ══════════════════════════════════════════════════════════════════════════════
  # T10: Tests — Event Collection (R7, 4 scenarios)
  # ══════════════════════════════════════════════════════════════════════════════
  - id: T10
    title: "Tests — Event Collection (R7, spec #15-#18)"
    file: tests/ingestion/infrastructure/test_unit_of_work.py
    depends_on: [T1, T2, T3]
    description: >
      Tests para R7: eventos recolectados solo post-commit, no sin commit,
      no después de rollback, y desde múltiples roots.

    details:
      imports_adicionales:
        - "from unittest.mock import MagicMock, PropertyMock"
        - "from foundation.base.aggregate_root import AggregateRoot"
        - "from foundation.events.domain_event import DomainEvent"

      test_R7_post_commit_collects_events:
        scenario: "#15 — Events collected after successful commit"
        code: |
          def test_events_collected_after_commit(uow):
              """Events MUST be in _collected_events after successful commit()."""
              event = MagicMock(spec=DomainEvent)
              root = MagicMock(spec=AggregateRoot)
              root.pull_events.return_value = [event]

              with uow:
                  uow.register_modified(root)
                  uow._session.commit = MagicMock()  # type: ignore[method-assign]
                  uow.commit()

              assert len(uow._collected_events) == 1
              assert uow._collected_events[0] is event

      test_R7_no_events_without_commit:
        scenario: "#16 — No events collected if commit() not called"
        code: |
          def test_no_events_without_commit(uow):
              """_collected_events MUST be empty if commit() was never called."""
              event = MagicMock(spec=DomainEvent)
              root = MagicMock(spec=AggregateRoot)
              root.pull_events.return_value = [event]

              with uow:
                  uow.register_modified(root)
                  # No commit() called

              assert len(uow._collected_events) == 0

      test_R7_no_events_after_rollback:
        scenario: "#17 — No events after rollback"
        code: |
          def test_no_events_after_rollback(uow):
              """_collected_events MUST be empty if rollback() was called."""
              event = MagicMock(spec=DomainEvent)
              root = MagicMock(spec=AggregateRoot)
              root.pull_events.return_value = [event]

              with uow:
                  uow.register_modified(root)
                  uow.rollback()
                  # No commit — events not collected even though registered

              assert len(uow._collected_events) == 0

      test_R7_multiple_roots_events:
        scenario: "#18 — Events from multiple roots collected"
        code: |
          def test_events_from_multiple_roots(uow):
              """Events from ALL registered roots MUST be collected."""
              event1 = MagicMock(spec=DomainEvent)
              event2 = MagicMock(spec=DomainEvent)
              root1 = MagicMock(spec=AggregateRoot)
              root1.pull_events.return_value = [event1]
              root2 = MagicMock(spec=AggregateRoot)
              root2.pull_events.return_value = [event2]

              with uow:
                  uow.register_modified(root1)
                  uow.register_modified(root2)
                  uow._session.commit = MagicMock()  # type: ignore[method-assign]
                  uow.commit()

              assert len(uow._collected_events) == 2
              assert event1 in uow._collected_events
              assert event2 in uow._collected_events

      test_R7_idempotent_register:
        scenario: "#19 — Same root registered multiple times appears once"
        code: |
          def test_register_modified_is_idempotent(uow):
              """Registering the same root 5 times MUST result in exactly 1 event collection."""
              event = MagicMock(spec=DomainEvent)
              root = MagicMock(spec=AggregateRoot)
              root.pull_events.return_value = [event]

              with uow:
                  # Register same root 5 times
                  uow.register_modified(root)
                  uow.register_modified(root)
                  uow.register_modified(root)
                  uow.register_modified(root)
                  uow.register_modified(root)
                  uow._session.commit = MagicMock()  # type: ignore[method-assign]
                  uow.commit()

              # pull_events called exactly once (not 5 times)
              root.pull_events.assert_called_once()
              assert len(uow._collected_events) == 1

    verify:
      - "pytest tests/ingestion/infrastructure/test_unit_of_work.py -k 'test_events_' — 5 PASS"

  # ══════════════════════════════════════════════════════════════════════════════
  # T11: Verify Regression (R8, spec #19)
  # ══════════════════════════════════════════════════════════════════════════════
