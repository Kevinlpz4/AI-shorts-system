# Dependencies
# ═══════════════════════════════════════════════════════════════════════════════
# T1 → T2 → T3 → T4...T10 (parallel after T3) → T11
#
# Orden de ejecución:
#   1. T1 (clase principal)
#   2. T2 (__init__.py export)
#   3. T3 (fixtures de test)
#   4. T4...T10 (tests — sin dependencias entre sí, dependen de T1,T2,T3)
#   5. T11 (regression — depende de todos los anteriores)

tasks:
  # ══════════════════════════════════════════════════════════════════════════════
  # T1: SQLAlchemyUnitOfWork class
  # ══════════════════════════════════════════════════════════════════════════════
  - id: T1
    title: "Crear SQLAlchemyUnitOfWork class"
    file: src/ingestion/infrastructure/persistence/unit_of_work.py
    action: create
    description: >
      Implementar la clase `SQLAlchemyUnitOfWork` que gestiona el ciclo de vida
      completo de una SQLAlchemy Session: creación en __enter__, compartición
      entre 5 repos, commit/rollback/close, y colección de eventos post-commit.

    details:
      imports:
        - "from __future__ import annotations"
        - "from collections.abc import Callable"
        - "from typing import Protocol, Self"
        - "from sqlalchemy.orm import Session"
        - "from sqlalchemy.exc import SQLAlchemyError"
        - "from foundation.base.aggregate_root import AggregateRoot"
        - "from foundation.events.domain_event import DomainEvent"
        - "from ingestion.infrastructure.persistence.exceptions import PersistenceError"
        - "from ingestion.infrastructure.persistence.repositories import ("
        - "    SQLAlchemyCategoryRepository,"
        - "    SQLAlchemyFeedRepository,"
        - "    SQLAlchemyNewsSourceRepository,"
        - "    SQLAlchemyRawArticleRepository,"
        - "    SQLAlchemyTopicRepository,"
        - ")"

      event_publisher_protocol:
        code: |
          class EventPublisher(Protocol):
              """Stub Protocol — real implementation in Sprint 5.4B.
              
              Defines the contract for publishing collected domain events.
              The UoW stores this reference in 5.4A but does NOT call it yet.
              """
              def publish_many(self, events: list[DomainEvent]) -> None: ...

      class: SQLAlchemyUnitOfWork
      docstring: >
        SQLAlchemy-backed Unit of Work. Owns Session lifecycle, shares it
        across 5 repos, manages commit/rollback/close, and collects domain
        events after successful commit. Accepts optional EventPublisher
        (not used until Sprint 5.4B).

      __init__:
        signature: >
          "(self, session_factory: Callable[[], Session],
          event_publisher: EventPublisher | None = None) -> None"
        body:
          - "self._session_factory = session_factory"
          - "self._event_publisher = event_publisher  # stored for 5.4B, not used yet"
          - "self._session: Session | None = None"
          - >
            self._modified_roots: set[AggregateRoot] = set()
            (set — idempotent: same root registered N times appears once)
          - "self._collected_events: list[DomainEvent] = []"
          - >
            self.news_sources: SQLAlchemyNewsSourceRepository | None = None
            (idem para feeds, raw_articles, categories, topics — todos None)

      __enter__:
        signature: "(self) -> Self"
        body:
          - "self._session = self._session_factory()"
          - >
            Inicializar los 5 repos con self._session:
            self.news_sources = SQLAlchemyNewsSourceRepository(self._session)
            (idem para los otros 4)
          - "return self"

      __exit__:
        signature: "(self, exc_type: object, exc_val: object, exc_tb: object) -> None"
        body:
          - "if exc_type is not None: self.rollback()"
          - "self.close()"
          - "return None  # explícito — nunca tragar excepción"

      commit:
        signature: "(self) -> None"
        body:
          - "if self._session is None: raise PersistenceError(...)"
          - "try: self._session.commit()"
          - "except SQLAlchemyError as exc: self._session.rollback(); raise PersistenceError(...) from exc"
          - "self._collect_events()"

      rollback:
        signature: "(self) -> None"
        body:
          - "if self._session is not None: self._session.rollback()"

      close:
        signature: "(self) -> None"
        body:
          - "if self._session is not None: self._session.close(); self._session = None"

      register_modified:
        signature: "(self, root: AggregateRoot) -> None"
        body:
          - "self._modified_roots.add(root)"

      _collect_events:
        signature: "(self) -> None"
        body:
          - "for root in self._modified_roots: self._collected_events.extend(root.pull_events())"
          - "self._modified_roots.clear()"

      error_handling:
        commit_sin_session: "PersistenceError('Cannot commit: no active session')"
        commit_failure: "rollback session internamente, raise PersistenceError(f'Commit failed: {exc}')"
        close_idempotente: "Si _session es None, no hacer nada"
        rollback_idempotente: "Si _session es None, no hacer nada"
        __exit__: "Nunca traga excepción — return None explícitamente"

    verify:
      - "Type-check con mypy — 0 errores"
      - "Import desde el módulo funciona: from ingestion.infrastructure.persistence.unit_of_work import SQLAlchemyUnitOfWork"
      - "Una instancia sin __enter__ tiene todos los repos = None"

