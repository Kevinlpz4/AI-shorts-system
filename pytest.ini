[pytest]
asyncio_mode = auto
addopts = -m "not integration"
pythonpath = src
markers =
    integration: Tests que hacen llamadas reales a APIs externas (OpenRouter, etc.)
    unit: Tests de unidad puros
    performance: Tests de rendimiento con mediciones p95

filterwarnings =
    ignore::DeprecationWarning:domain.*
    ignore::DeprecationWarning:infrastructure.*
